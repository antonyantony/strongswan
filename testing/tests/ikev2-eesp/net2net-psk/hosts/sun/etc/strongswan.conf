# /etc/strongswan.conf - strongSwan configuration file

swanctl {
  load = pem pkcs1 pubkey openssl random
}

charon-systemd {
  load = random nonce openssl pem pkcs1 revocation curl kernel-netlink socket-default updown vici

  # EESPv0 SN transform values use provisional private-use range (>=1024);
  # remove when IANA assigns real values
  accept_private_algs = yes

  syslog {
    daemon {
      ike = 2
    }
  }
}
