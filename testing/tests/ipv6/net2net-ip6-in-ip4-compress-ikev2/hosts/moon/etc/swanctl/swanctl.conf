connections {

   net-net {
      local_addrs  = 192.168.0.1
      remote_addrs = 192.168.0.2

      local {
         auth = pubkey
         certs = moonCert.pem
         id = moon.strongswan.org
      }
      remote {
         auth = pubkey
         id = sun.strongswan.org
      }
      children {
         net-net {
            local_ts  = fec1::0/16
            remote_ts = fec2::0/16

            esp_proposals = aes128-sha256-x25519
            ipcomp = yes
            start_action = trap
         }
      }
      version = 2
      mobike = no
      proposals = aes128-sha256-x25519
   }
}

authorities {
   strongswan {
      cacert = strongswanCert.pem
      crl_uris = http://winnetou.strongswan.org/strongswan.crl
   }
}
