connections {
	ikepeer4 {
		local_addrs  = 192.168.1.101
		remote_addrs = 192.168.1.1
		local {
			id = perf2
			auth = psk
		}
		remote {
			id = perf1
			auth = psk
		}
		children {
			flow4 {
				# per_cpu_sas = yes
				local_ts  = 10.1.1.0/24
				remote_ts = 10.0.1.0/24
				start_action = route
				# rekey_time=90s
			}
		}
		mobike = no
	}

	ikepeer6 {
		local_addrs  = fdff:aaaa:bbbb:1::101
		remote_addrs = fdff:aaaa:bbbb:1::1
		local {
			id = perf2
			auth = psk
		}
		remote {
			id = perf1
			auth = psk
		}
		children {
			flow6 {
					# rekey_time=90
					per_cpu_sas = yes
					# for UDP encap
					# per_cpu_sas = encap
					local_ts  = fdaa:1234:1:1::0/64
					remote_ts = fdaa:1234:0:1::0/64
					start_action = none
			}
		}
		encap = no
		keyingtries=1
	}
}
